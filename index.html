<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Player</title>
<style>
:root{--play:#1ed760;--active:#1ed760;--bar:#1ed760;--bg:#000;--card:#181818;--line:#2a2a2a;--mut:#a7a7a7;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 24px;display:none}
.view.on{display:block}
h1{font-size:26px;margin:4px 0 14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:24px;height:24px;fill:currentColor;display:block}
.add{display:inline-flex;gap:8px;align-items:center;background:#fff;color:#000;font-weight:700;padding:10px 18px;border-radius:99px;margin-bottom:14px}
.add svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.row .t{flex:1;min-width:0}
.t b,.t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{color:var(--mut);font-size:13px;margin-top:2px}
.thumb{width:48px;height:48px;border-radius:4px;background:var(--card) center/cover;flex:none}
.row.cur .t b{color:var(--active)}
.eq{display:none;width:18px;height:18px;fill:var(--active)}
.row.cur .eq{display:block}
.x{color:var(--mut);padding:8px}.x svg{width:18px;height:18px}
.empty{color:var(--mut);padding:40px 0;text-align:center;line-height:1.5}
.art{width:100%;max-width:340px;aspect-ratio:1;margin:12px auto 20px;display:block;border-radius:8px;background:var(--card) center/cover;box-shadow:0 12px 40px #000a}
.np h2{margin:0;font-size:22px}.np p{margin:4px 0 16px;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline:0;margin:10px 0;background:linear-gradient(to right,var(--bar) var(--p,0%),#4d4d4d var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 4px}
.ctl button{color:var(--mut);padding:10px;position:relative}
.ctl button.on{color:var(--active)}
.ctl button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--active)}
.ctl .skip{color:#fff}.ctl .skip svg{width:32px;height:32px}
.ctl .pp{background:var(--play);color:#000;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;padding:0}
.ctl .pp svg{width:34px;height:34px}
.mini{display:none;align-items:center;gap:10px;background:var(--card);margin:0 8px 6px;padding:6px 10px 6px 6px;border-radius:8px}
.mini.on{display:flex}
.mini .thumb{width:40px;height:40px}
.mini .pp2{background:#fff;color:#000;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.mini .pp2 svg{width:20px;height:20px}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
nav button{flex:1;padding:10px 0 8px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:#fff}
.set{padding:14px 0;border-bottom:1px solid var(--line)}
.set label{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.set small{color:var(--mut);display:block;font-weight:400;margin-top:2px}
.sw{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.sw i{width:30px;height:30px;border-radius:50%;display:block;border:2px solid transparent}
input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
.btn{background:#2a2a2a;padding:10px 16px;border-radius:99px;font-weight:600;margin:16px 10px 0 0}
.hd{display:flex;align-items:center;justify-content:space-between}
.plus{width:40px;height:40px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;margin-bottom:10px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.sec h3{margin:0;font-size:18px}.tog{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:700}
.chev{transition:transform .2s}.closed .chev{transform:rotate(-90deg)}
.pl .thumb{width:56px;height:56px;display:grid;place-items:center;color:var(--mut)}
.back{padding:8px 8px 8px 0;margin-bottom:6px}
.phead{text-align:center}
.cover{width:170px;height:170px;margin:6px auto 14px;border-radius:6px;background:var(--card) center/cover;display:grid;place-items:center;color:var(--mut);box-shadow:0 12px 40px #000a}
.phead h2{margin:0;font-size:24px}.phead p{margin:4px 0 0;color:var(--mut)}
.pact{display:flex;align-items:center;gap:6px;margin:14px 0 8px}
.pact button{color:var(--mut);padding:10px}.pact .on{color:var(--active)}
.pact .big{margin-left:auto;background:var(--play);color:#000;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;padding:0}
.pact .big svg{width:30px;height:30px}
.sheet{position:fixed;inset:0;background:#000b;display:none;z-index:9;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:#121212;width:100%;max-height:88%;display:flex;flex-direction:column;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet input[type=text]{width:100%;background:#2a2a2a;border:0;color:#fff;font:inherit;padding:12px;border-radius:6px;margin:10px 0}
.pick{overflow-y:auto;flex:1}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center}
.sel .chk{background:var(--active);border-color:var(--active);color:#000}
.chk svg{width:14px;height:14px;display:none}.sel .chk svg{display:block}
.save{background:var(--play);color:#000;font-weight:700;padding:13px;border-radius:99px;margin-top:12px;width:100%}
button,.row,.tog{transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.9)}.row:active{background:#ffffff14}
.view.on{animation:fin .25s ease}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.art{transition:transform .35s cubic-bezier(.3,1.3,.5,1)}.art.paused{transform:scale(.88)}
.sheet.on>div{animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mini{position:relative;overflow:hidden;touch-action:pan-y;transition:transform .2s,background .5s}
@keyframes fin{from{opacity:0;transform:translate(var(--dx,0px),8px)}to{opacity:1;transform:none}}
.mini .mp{position:absolute;left:0;bottom:0;height:2px;width:0;background:#fff}
body{background:linear-gradient(180deg,var(--gradc,transparent) 0,var(--bg) 65%)}
nav{background:transparent}nav [data-v=set]{order:-1}nav [data-v=lib]{order:1}
nav{order:-1;border:0;padding:6px 8px 0;background:transparent}
nav button{flex:1;padding:12px 0 10px;font-size:15px;font-weight:600;color:var(--mut);display:block;position:relative;transition:font-size .2s,color .2s}
nav button svg{display:none}nav button.on{color:#fff;font-size:20px}
nav button::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:3px;border-radius:2px;background:var(--active);transform:scaleX(0);transition:transform .25s}
nav button.on::after{transform:scaleX(1)}
.mini{margin-bottom:calc(6px + env(safe-area-inset-bottom))}
.mos{width:100%;height:100%;display:grid;grid-template:1fr 1fr/1fr 1fr;overflow:hidden}.mos i{background:center/cover}
.chips{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:96px}.chip .th{width:96px;height:96px;border-radius:6px;background:var(--card);overflow:hidden;display:grid;place-items:center;color:var(--mut);border:2px solid transparent}
.chip.on .th{border-color:var(--active)}.chip.on b{color:var(--active)}
.chip b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view.on{animation:none}
.mini{flex-direction:column;align-items:stretch;gap:0;height:64px;padding:6px 10px 6px 6px;border-radius:20px;touch-action:none;transition:height .38s cubic-bezier(.3,.7,.2,1),background .5s}
.mini.big{height:34vh}
.mrow{position:relative;display:flex;align-items:center;gap:10px;min-height:52px}
.mbg{position:absolute;inset:-30px;background:center/cover;filter:blur(30px) brightness(.55);opacity:0;transition:opacity .45s}
.mini.big .mbg{opacity:1}
.mx{position:relative;display:none;margin-top:auto;padding:0 6px 6px}.mini.big .mx{display:block}
.mctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mctl button{color:#ffffffcc;padding:8px}.mctl button.on{color:var(--active)}
.mctl .mbig{background:var(--play);color:#000;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;padding:0}.mctl .mbig svg{width:28px;height:28px}
.seg{display:flex;gap:8px;margin:2px 0 14px}
.seg button{padding:8px 18px;border-radius:99px;background:#2a2a2a;font-weight:600;font-size:14px;transition:background .2s,color .2s}
.seg button.on{background:var(--active);color:#000}
#songsec{justify-content:flex-end}#tog{display:none}
.chips{overflow:visible;gap:10px}.chip{flex:1;min-width:0;width:auto}.chip .th{width:100%;height:auto;aspect-ratio:1}
.thumb,.cover{overflow:hidden}.thumb{border-radius:12px}.mini .thumb{border-radius:12px}
.art{border-radius:28px}.cover{border-radius:22px}.chip .th{border-radius:18px}
.sheet>div{border-radius:28px 28px 0 0}.sheet input[type=text]{border-radius:14px}
input[type=color]{border-radius:10px}.row{border-radius:14px;padding:8px 6px;margin:0 -6px}
.set{border-radius:0}.empty{border-radius:16px}
.mini.big{height:176px}.mx{margin-top:4px}.view.on{will-change:transform}
</style></head><body>
<main>
 <section class="view on" id="v-lib"><div class="hd"><h1>Your library</h1><button class="plus" id="newpl" aria-label="New playlist"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button></div><div class="seg" id="seg"><button class="on" data-s="pl">Playlists</button><button data-s="songs">Songs</button></div><div id="lpl"><div id="pls"></div></div><div id="lsg" style="display:none"><div class="sec" id="songsec"><button class="tog" id="tog" aria-label="Show or hide songs"><svg viewBox="0 0 24 24" class="chev"><path d="M7 10l5 5 5-5z"/></svg>Songs</button><button class="add" id="add" style="margin:0;padding:8px 14px"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79l5 5L20.49 19zM9.5 14a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>Scan phone</button></div><input type="file" id="file" accept="audio/*,.mp3" multiple hidden><div id="list"></div></div></section>
<section class="view" id="v-pl"><button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button><div class="phead"><div class="cover" id="pcover"></div><h2 id="pname"></h2><p id="pcount"></p></div><div class="pact"><button id="pedit" aria-label="Edit playlist"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg></button><button id="pdel" aria-label="Delete playlist"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button><button id="pshuf" aria-label="Shuffle"></button><button class="big" id="pplay" aria-label="Play playlist"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div><div id="plist"></div></section>
 <section class="view np" id="v-np">
  <div class="art paused" id="art"></div>
  <h2 id="title">Nothing playing</h2><p id="artist">Add songs in Library</p>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
   <button id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 4 2.6 2.6 4l6.6 6.6zM14.5 4l2.05 2.05L2.6 20 4 21.4 17.95 7.45 20 9.5V4zm.3 9.8-1.4 1.4 3.15 3.15L14.5 20H20v-5.5l-2.05 2.05z"/></svg></button>
   <button class="skip" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
   <button class="pp" id="pp" aria-label="Play or pause"></button>
   <button class="skip" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
   <button id="rep" aria-label="Repeat"></button>
  </div><div class="sec" style="margin-top:22px"><h3>Playlists</h3></div><div class="chips" id="npl"></div></section>
 <section class="view" id="v-set"><h1>Settings</h1>
  <div class="set"><label>Play button<input type="color" data-k="play"></label><small>The big circle button</small></div>
  <div class="set"><label>Highlights<input type="color" data-k="active"></label><small>Shuffle, repeat and the song that is playing</small></div>
  <div class="set"><label>Progress bar<input type="color" data-k="bar"></label></div>
  <div class="set"><label>Background glow<input type="color" data-k="grad"></label><small>Set to black to turn it off</small></div>
  <div class="set"><label>Add files manually<button class="btn" id="addm" style="margin:0">Choose files</button></label><small>Use this if scanning misses a song</small></div>
  <div class="set"><label>Quick colors</label><div class="sw" id="sw"></div></div>
  <button class="btn" id="reset">Reset colors</button><button class="btn" id="clear">Delete all songs and playlists</button>
 </section>
</main>
<div class="mini" id="mini"><div class="mbg" id="mbg"></div><div class="mrow" id="mrow"><div class="thumb" id="mthumb"></div><div class="t" style="flex:1;min-width:0"><b id="mt"></b><span id="ma" style="color:#ffffffb3;font-size:13px"></span></div><button class="pp2" id="mpp"></button></div><div class="mx" id="mx"><input type="range" id="mseek" min="0" max="1000" value="0"><div class="times"><span id="mcur">0:00</span><span id="mdur">0:00</span></div><div class="mctl"><button data-a="shuf" id="mshuf"></button><button data-a="prev" id="mprev"></button><button class="mbig" data-a="pp" id="mpp2"></button><button data-a="next" id="mnext"></button><button data-a="rep" id="mrep"></button></div></div><i class="mp" id="mp"></i></div>
<div class="sheet" id="sheet"><div><b id="sh-t" style="font-size:18px"></b><input type="text" id="sh-n" placeholder="Playlist name" maxlength="60"><div class="pick" id="pick"></div><button class="save" id="sh-ok">Save</button><button class="btn" id="sh-x" style="margin:8px 0 0;width:100%">Cancel</button></div></div>
<nav>
 <button class="on" data-v="lib"><svg viewBox="0 0 24 24"><path d="M4 4h2v16H4zm4 0h2v16H8zm4.6.3 1.9-.5 4.4 15.9-1.9.5z"/></svg>Library</button>
 <button data-v="np"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>Playing</button>
 <button data-v="set"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.300 7.300 0 0 0-1.700 1l-2.500-1-2 3.500L6.600 11a7.800 7.800 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.700 1.700 1l.4 2.600h4l.4-2.600c.6-.300 1.200-.600 1.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z" transform="translate(-1 0)"/></svg>Settings</button>
</nav>
<script>
const $=s=>document.querySelector(s),au=new Audio();
const I={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>',
 rep1:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.500v4z"/></svg>',
 del:'<svg viewBox="0 0 24 24"><path d="M19 6.400 17.600 5 12 10.600 6.400 5 5 6.400l5.600 5.600L5 17.600 6.400 19l5.600-5.600 5.600 5.600 1.400-1.400-5.600-5.600z"/></svg>',
 eq:'<svg class="eq" viewBox="0 0 24 24"><path d="M4 12h3v8H4zm6.500-8h3v16h-3zM17 8h3v12h-3z"/></svg>'};
const COLORS=['#1ed760','#1db4ff','#ff3d71','#ff9f1a','#a855f7','#ffe14d','#ffffff'];
const DEF={play:'#1ed760',active:'#1ed760',bar:'#1ed760',grad:'#1ed760'};
let songs=[],pls=[],queue=[],qi=-1,openPl=null,qsrc=null,hist=[],curId=null,recent=[],showSongs=true,shuf=false,rep=0,db,cfg={...DEF},urls={};

/* ---- storage ---- */
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('player',2);r.onupgradeneeded=()=>{const d=r.result;for(const n of['songs','playlists'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const tx=(m,f,st='songs')=>new Promise((ok,no)=>{const t=db.transaction(st,m),q=f(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)});

/* ---- ID3 tags ---- */
function dec(b,e){try{return new TextDecoder(['iso-8859-1','utf-16','utf-16be','utf-8'][e]||'utf-8').decode(b).replace(/\0+$/,'').replace(/^\uFEFF/,'')}catch{return''}}
async function tags(file){
 const o={};try{
 const d=new Uint8Array(await file.slice(0,3e6).arrayBuffer());
 if(String.fromCharCode(d[0],d[1],d[2])!=='ID3')return o;
 const v=d[3],ss=(a,i)=>(a[i]&127)<<21|(a[i+1]&127)<<14|(a[i+2]&127)<<7|(a[i+3]&127);
 const end=Math.min(ss(d,6)+10,d.length);let p=10;
 if(d[5]&64)p+=v===4?ss(d,10):(d[10]<<24|d[11]<<16|d[12]<<8|d[13])+4;
 while(p+10<end){
  const id=String.fromCharCode(d[p],d[p+1],d[p+2],d[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
  const n=v===4?ss(d,p+4):(d[p+4]<<24|d[p+5]<<16|d[p+6]<<8|d[p+7])>>>0,f=d.subarray(p+10,p+10+n);p+=10+n;
  if(id==='TIT2')o.title=dec(f.subarray(1),f[0]);
  else if(id==='TPE1')o.artist=dec(f.subarray(1),f[0]);
  else if(id==='TALB')o.album=dec(f.subarray(1),f[0]);
  else if(id==='APIC'&&!o.art){
   const e=f[0];let i=1;while(f[i])i++;const mime=dec(f.subarray(1,i),0)||'image/jpeg';i+=2;
   if(e===1||e===2){while(!(f[i]===0&&f[i+1]===0))i+=2;i+=2}else{while(f[i])i++;i++}
   o.art=new Blob([f.subarray(i)],{type:mime.includes('/')?mime:'image/'+mime})}
 }}catch(e){}return o}

/* ---- library ---- */
async function load(){songs=(await tx('readonly',s=>s.getAll())).sort((a,b)=>(b.added||0)-(a.added||0)||b.id-a.id);pls=await tx('readonly',s=>s.getAll(),'playlists');render()}
function artURL(s){if(!s.art)return'';return urls[s.id]||(urls[s.id]=URL.createObjectURL(s.art))}
const playing=()=>queue[qi]&&queue[qi].id;
const sRow=(s,i,x)=>`<div class="row${s.id===playing()?' cur':''}" data-i="${i}"><div class="thumb" style="${s.art?`background-image:url(${artURL(s)})`:''}"></div><div class="t"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div>${I.eq}${x}</div>`;
const plSongs=p=>p.songIds.map(id=>songs.find(s=>s.id===id)).filter(Boolean);
const coverURL=p=>{const s=plSongs(p).find(s=>s.art);return s?artURL(s):''};
function render(){
 $('#pls').innerHTML=pls.length?pls.map(p=>{const n=plSongs(p).length;return `<div class="row pl" data-p="${p.id}"><div class="thumb">${coverHTML(p)}</div><div class="t"><b>${esc(p.name)}</b><span>${n} ${n===1?'song':'songs'}</span></div></div>`}).join(''):'<div class="empty" style="padding:14px 0">No playlists yet. Tap + to make one.</div>';
 $('#songsec').classList.toggle('closed',!showSongs);
 const L=$('#list');L.style.display='';
 L.innerHTML=songs.length?songs.map((s,i)=>sRow(s,i,`<button class="x" data-d="${s.id}" aria-label="Remove">${I.del}</button>`)).join(''):'<div class="empty">No songs yet.<br>Tap Scan phone to find your music.<br>They are saved on this device and work offline.</div>';
 renderNpl();if(openPl)renderPl()}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#add').onclick=scan;$('#addm').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 for(const f of e.target.files){const t=await tags(f);
  await tx('readwrite',s=>s.add({file:f,added:f.lastModified,title:t.title||f.name.replace(/\.[^.]+$/,''),artist:t.artist||'Unknown artist',album:t.album||'',art:t.art||null}))}
 e.target.value='';await load()};
$('#list').onclick=async e=>{
 const d=e.target.closest('[data-d]');
 if(d){const id=+d.dataset.d;await tx('readwrite',s=>s.delete(id));for(const p of pls)if(p.songIds.includes(id)){p.songIds=p.songIds.filter(x=>x!==id);await tx('readwrite',s=>s.put(p),'playlists')}const was=playing();queue=queue.filter(s=>s.id!==id);
  if(was===id){au.pause();au.removeAttribute('src');qi=-1;info()}else qi=queue.findIndex(s=>s.id===was);await load();return}
 const r=e.target.closest('.row');if(r){queue=songs.slice();qsrc='all';go(+r.dataset.i)}};

/* ---- playback ---- */
let curURL;
function go(i,np){
 if(i<0||i>=queue.length)return;if(!np&&curId!=null){hist.push({id:curId});if(hist.length>200)hist.shift()}qi=i;curId=queue[i].id;if(qsrc!=null&&recent[0]!==qsrc){recent=[qsrc,...recent.filter(x=>x!==qsrc)].slice(0,8);save()}
 if(curURL)URL.revokeObjectURL(curURL);curURL=queue[i].file?URL.createObjectURL(queue[i].file):Capacitor.convertFileSrc(queue[i].path);
 au.src=curURL;au.play().catch(()=>{});info();render()}
function info(){
 const s=queue[qi],a=s&&artURL(s);
 $('#title').textContent=s?s.title:'Nothing playing';$('#artist').textContent=s?s.artist:'Add songs in Library';
 $('#art').style.backgroundImage=a?`url(${a})`:'';$('#mthumb').style.backgroundImage=a?`url(${a})`:'';
 $('#mbg').style.backgroundImage=a?'url('+a+')':'';avgC(s||{}).then(c=>{$('#mini').style.background=c?'rgb('+c+')':''});$('#mt').textContent=s?s.title:'';$('#ma').textContent=s?s.artist:'';$('#mini').classList.toggle('on',!!s&&!$('#v-np').classList.contains('on'));
 if('mediaSession'in navigator&&s)navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:s.art?[{src:a,sizes:'512x512',type:s.art.type}]:[]})}
function next(auto){
 if(!queue.length)return;
 if(auto&&rep===2){au.currentTime=0;au.play();return}
 let n;
 if(shuf&&queue.length>1){do n=Math.floor(Math.random()*queue.length);while(n===qi)}
 else{n=qi+1;if(n>=queue.length){if(auto&&rep===0){au.pause();au.currentTime=0;return}n=0}}
 go(n)}
function prev(){if(au.currentTime>3){au.currentTime=0;return}while(hist.length){const h=hist.pop(),k=queue.findIndex(x=>x.id===h.id);if(k>=0)return go(k,true)}go(qi<=0?queue.length-1:qi-1,true)}
const toggle=()=>{if(qi<0&&songs.length){queue=songs.slice();qsrc='all';return go(0)}au.paused?au.play():au.pause()};
$('#pp').onclick=$('#mpp').onclick=toggle;$('#next').onclick=()=>next(false);$('#prev').onclick=prev;
$('#shuf').onclick=()=>{shuf=!shuf;ui();save()};
$('#rep').onclick=()=>{rep=(rep+1)%3;ui();save()};
$('#mini').onclick=e=>{if(!M.classList.contains('big')&&!e.target.closest('#mpp'))show('np')};
au.onended=()=>next(true);
au.onplay=au.onpause=()=>{const h=au.paused?I.play:I.pause;$('#pp').innerHTML=h;$('#mpp').innerHTML=h;document.querySelectorAll('.eq').forEach(x=>x.style.opacity=au.paused?.4:1);$('#art').classList.toggle('paused',au.paused);pplIcon();mSync();sync()};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
let drag=false;
au.ontimeupdate=()=>{if(drag||!au.duration)return;const p=au.currentTime/au.duration*1000;$('#seek').value=p;$('#seek').style.setProperty('--p',p/10+'%');$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration);$('#mp').style.width=p/10+'%';if(!mdrag){$('#mseek').value=p;$('#mseek').style.setProperty('--p',p/10+'%');$('#mcur').textContent=fmt(au.currentTime);$('#mdur').textContent=fmt(au.duration)}};
$('#seek').oninput=e=>{drag=true;const p=e.target.value;e.target.style.setProperty('--p',p/10+'%');$('#cur').textContent=fmt(au.duration*p/1000)};
$('#seek').onchange=e=>{au.currentTime=au.duration*e.target.value/1000;drag=false};
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',()=>next(false));m.setActionHandler('previoustrack',prev)}
function ui(){setTimeout(mSync,0);$('#pshuf').classList.toggle('on',shuf);$('#shuf').classList.toggle('on',shuf);$('#rep').classList.toggle('on',rep>0);$('#rep').innerHTML=rep===2?I.rep1:I.rep}

/* ---- playlists ---- */
I.note=`<svg viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>`;
const CHK=`<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`;
$('#pshuf').innerHTML=$('#shuf').innerHTML;$('#pshuf').onclick=$('#shuf').onclick;
$('#tog').onclick=()=>{showSongs=!showSongs;render();save()};
function renderPl(){pplIcon();
 const p=pls.find(x=>x.id===openPl);if(!p){openPl=null;return}
 const l=plSongs(p);
 $('#pname').textContent=p.name;$('#pcount').textContent=l.length+(l.length===1?' song':' songs');
 $('#pcover').innerHTML=coverHTML(p);
 $('#plist').innerHTML=l.length?l.map((s,i)=>sRow(s,i,`<button class="x" data-r="${s.id}" aria-label="Remove from playlist">${I.del}</button>`)).join(''):'<div class="empty">This playlist is empty.<br>Tap the pencil to add songs.</div>'}
$('#pls').onclick=e=>{const r=e.target.closest('[data-p]');if(r){openPl=+r.dataset.p;renderPl();show('pl')}};
$('#back').onclick=()=>{openPl=null;show('lib')};
$('#plist').onclick=async e=>{
 const p=pls.find(x=>x.id===openPl),m=e.target.closest('[data-r]');
 if(m){p.songIds=p.songIds.filter(x=>x!==+m.dataset.r);await tx('readwrite',s=>s.put(p),'playlists');render();return}
 const r=e.target.closest('.row');if(r){queue=plSongs(p);qsrc=p.id;go(+r.dataset.i)}};
$('#pplay').onclick=()=>{if(qsrc===openPl&&qi>=0)return toggle();const p=pls.find(x=>x.id===openPl);queue=plSongs(p);qsrc=openPl;if(queue.length)go(shuf?Math.floor(Math.random()*queue.length):0)};
$('#pdel').onclick=async()=>{const p=pls.find(x=>x.id===openPl);if(!p||!confirm('Delete "'+p.name+'"? Your songs stay in the library.'))return;await tx('readwrite',s=>s.delete(p.id),'playlists');openPl=null;await load();show('lib')};
let shCb,shSel=new Set();
function sheet(title,name,sel,cb){
 shSel=new Set(sel);shCb=cb;$('#sh-t').textContent=title;$('#sh-n').value=name;
 $('#pick').innerHTML=songs.length?songs.map(s=>`<div class="row${shSel.has(s.id)?' sel':''}" data-s="${s.id}"><div class="thumb" style="${s.art?`background-image:url(${artURL(s)})`:''}"></div><div class="t"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div><div class="chk">${CHK}</div></div>`).join(''):'<div class="empty">Add songs to your library first.</div>';
 $('#sheet').classList.add('on')}
$('#pick').onclick=e=>{const r=e.target.closest('[data-s]');if(!r)return;const id=+r.dataset.s;shSel.has(id)?shSel.delete(id):shSel.add(id);r.classList.toggle('sel')};
$('#sh-x').onclick=()=>$('#sheet').classList.remove('on');
$('#sh-ok').onclick=async()=>{const n=$('#sh-n').value.trim();if(!n){$('#sh-n').focus();return}await shCb(n,[...shSel]);$('#sheet').classList.remove('on')};
$('#newpl').onclick=()=>sheet('New playlist','My playlist '+(pls.length+1),[],async(n,ids)=>{await tx('readwrite',s=>s.add({name:n,songIds:ids}),'playlists');await load()});
$('#pedit').onclick=()=>{const p=pls.find(x=>x.id===openPl);sheet('Edit playlist',p.name,p.songIds,async(n,ids)=>{p.name=n;p.songIds=ids;await tx('readwrite',s=>s.put(p),'playlists');await load()})};

/* ---- mini-player swipe, native controls ---- */
function pplIcon(){$('#pplay').innerHTML=(!au.paused&&qsrc===openPl)?I.pause:I.play}
const M=$('#mini'),MR=$('#mrow');let sx=0,sy=0,ax=null,mdrag=false;
M.ontouchstart=e=>{if(e.target.closest('input')){ax='n';return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;ax=null;MR.getAnimations().forEach(a=>a.cancel())};
M.ontouchmove=e=>{if(ax==='n')return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
 if(ax==null&&(Math.abs(dx)>8||Math.abs(dy)>8))ax=Math.abs(dx)>Math.abs(dy)?'x':'y';
 if(ax==='x')MR.style.transform=`translateX(${dx*.8}px)`};
M.ontouchend=e=>{if(ax==='n'){ax=null;return}const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,a=ax;ax=null;MR.style.transform='';
 if(a==='y'){if(dy<-40)M.classList.add('big');else if(dy>40)M.classList.remove('big');return}
 if(a==='x'&&Math.abs(dx)>60)slide(dx<0?-1:1,dx<0?()=>next(false):prev,dx*.8)};
function slide(d,fn,f){MR.animate([{transform:`translateX(${f}px)`,opacity:1},{transform:`translateX(${d*100}%)`,opacity:0}],{duration:170,easing:'ease-in',fill:'forwards'}).onfinish=()=>{fn();MR.getAnimations().forEach(a=>a.cancel());MR.animate([{transform:`translateX(${-d*100}%)`,opacity:0},{transform:'none',opacity:1}],{duration:240,easing:'ease-out'})}}
const MP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Music,artC={};
function artB64(s){if(!s.art)return Promise.resolve('');if(artC[s.id]!==undefined)return Promise.resolve(artC[s.id]);
 return new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=300;c.getContext('2d').drawImage(im,0,0,300,300);ok(artC[s.id]=c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=()=>ok('');im.src=artURL(s)})}
async function sync(){const s=queue[qi];if(!MP||!s)return;MP.update({title:s.title,artist:s.artist,playing:!au.paused,pos:Math.floor(au.currentTime*1000),dur:isFinite(au.duration)?Math.floor(au.duration*1000):0,art:await artB64(s)}).catch(()=>{})}
au.onloadedmetadata=sync;
if(MP)MP.addListener('action',e=>{const f={play:()=>au.play(),pause:()=>au.pause(),next:()=>next(false),prev:prev}[e.action];if(f)f()});

let scanning=false;
async function scan(){
 if(!MP||!MP.scan){alert('Scanning only works in the installed app.');return}
 if(scanning)return;scanning=true;const b=$('#add'),t=b.innerHTML;
 try{
  b.textContent='Scanning...';
  const r=await MP.scan(),have=new Set(songs.map(x=>x.path).filter(Boolean)),fresh=r.songs.filter(x=>x.path&&!have.has(x.path));let n=0;
  for(const x of r.songs){const o=songs.find(y=>y.path===x.path);if(o&&x.added&&o.added!==x.added){o.added=x.added;await tx('readwrite',q=>q.put(o))}}
  for(const x of fresh){
   b.textContent='Adding '+(++n)+'/'+fresh.length;let art=null;
   try{const bl=await(await fetch(Capacitor.convertFileSrc(x.path),{headers:{Range:'bytes=0-1500000'}})).blob();art=(await tags(bl)).art||null}catch(e){}
   await tx('readwrite',q=>q.add({path:x.path,added:x.added,title:x.title||x.path.split('/').pop(),artist:x.artist,album:x.album||'',art}))}
  await load();b.textContent=fresh.length?'Added '+fresh.length:'Nothing new'
 }catch(e){b.textContent='Permission needed'}
 setTimeout(()=>{b.innerHTML=t;scanning=false},2000)}

/* ---- cover mosaic, playlist chips, status bar ---- */
const mosC={};
function coverHTML(p){
 const sig=p.songIds.join(',');if(mosC[p.id]&&mosC[p.id].sig===sig)return mosC[p.id].h;
 const l=plSongs(p).filter(s=>s.art);let h=I.note;
 if(l.length){const seen=new Set(),pick=[];for(const s of l.sort(()=>Math.random()-.5)){if(!seen.has(s.art.size)){seen.add(s.art.size);pick.push(s)}if(pick.length===4)break}
  h=pick.length<4?`<div class="mos" style="display:block;background:url(${artURL(pick[0])}) center/cover"></div>`:`<div class="mos">${pick.map(s=>`<i style="background-image:url(${artURL(s)})"></i>`).join('')}</div>`}
 mosC[p.id]={sig,h};return h}
function renderNpl(){const el=$('#npl');if(!el)return;
 let r=recent.filter(k=>k==='all'||pls.some(p=>p.id===k));for(const p of pls)if(r.length<4&&!r.includes(p.id))r.push(p.id);if(r.length<4&&!r.includes('all'))r.push('all');
 el.innerHTML=r.slice(0,4).map(k=>{const p=k==='all'?null:pls.find(x=>x.id===k);return `<div class="chip${qsrc===k?' on':''}" data-p="${k}"><div class="th">${p?coverHTML(p):I.note}</div><b>${p?esc(p.name):'All songs'}</b></div>`}).join('')}
$('#npl').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.p;if(String(qsrc)===k&&qi>=0)return;
 queue=k==='all'?songs.slice():plSongs(pls.find(p=>p.id===+k));qsrc=k==='all'?'all':+k;
 if(queue.length)go(shuf?Math.floor(Math.random()*queue.length):0);renderNpl()};
function bar(){try{if(!MP||!MP.bar)return;const h=cfg.grad.replace('#',''),f=n=>Math.round(parseInt(h.substr(n,2),16)*.333).toString(16).padStart(2,'0');MP.bar({color:'#'+f(0)+f(2)+f(4)})}catch(e){}}

/* ---- library tabs, mini controls ---- */
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));$('#lpl').style.display=b.dataset.s==='pl'?'':'none';$('#lsg').style.display=b.dataset.s==='songs'?'':'none'};
function mSync(){$('#mshuf').className=shuf?'on':'';$('#mrep').className=rep>0?'on':'';$('#mrep').innerHTML=$('#rep').innerHTML;$('#mpp2').innerHTML=au.paused?I.play:I.pause}
$('#mshuf').innerHTML=$('#shuf').innerHTML;$('#mprev').innerHTML=$('#prev').innerHTML;$('#mnext').innerHTML=$('#next').innerHTML;
$('#mx').onclick=e=>{const b=e.target.closest('button');if(!b)return;({shuf:()=>$('#shuf').click(),prev:()=>prev(),pp:()=>toggle(),next:()=>next(false),rep:()=>$('#rep').click()})[b.dataset.a]()};
$('#mseek').oninput=e=>{mdrag=true;const p=e.target.value;e.target.style.setProperty('--p',p/10+'%');$('#mcur').textContent=fmt(au.duration*p/1000)};
$('#mseek').onchange=e=>{au.currentTime=au.duration*e.target.value/1000;mdrag=false};

/* ---- art colour, tab swipe ---- */
const colC={};
function avgC(s){return new Promise(ok=>{if(!s.art)return ok(null);if(colC[s.id])return ok(colC[s.id]);const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4;ok(colC[s.id]=[r/n,g/n,b/n].map(v=>Math.round(v*.65)))};im.onerror=()=>ok(null);im.src=artURL(s)})}

/* ---- tabs & settings ---- */
const ORD={set:0,np:1,lib:2,pl:3},TABS=['set','np','lib'],MN=$('main');let curV='lib',stok=0,dg=null;
const clr=x=>{x.style.transition='';x.style.transform=''};
function show(v,fx){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='pl'?'lib':v)));
 $('#mini').classList.toggle('on',qi>=0&&v!=='np');
 if(v===curV)return;
 const from=$('#v-'+curV),to=$('#v-'+v),w=MN.clientWidth,dir=ORD[v]>ORD[curV]?1:-1,x0=fx||0;
 document.querySelectorAll('.view.on').forEach(x=>{if(x!==from&&x!==to){x.classList.remove('on');clr(x)}});
 to.classList.add('on');
 from.style.transition=to.style.transition='none';
 from.style.transform=`translateX(${x0}px)`;to.style.transform=`translateX(${dir*w+x0}px)`;
 void to.offsetWidth;
 const t='transform .22s cubic-bezier(.2,.8,.25,1)';from.style.transition=to.style.transition=t;
 from.style.transform=`translateX(${-dir*w}px)`;to.style.transform='translateX(0px)';
 curV=v;const k=++stok;
 setTimeout(()=>{if(k!==stok)return;from.classList.remove('on');clr(from);clr(to)},240)}
const nb=dx=>{if(curV==='pl')return dx>0?'lib':null;return TABS[TABS.indexOf(curV)+(dx<0?1:-1)]||null};
MN.addEventListener('touchstart',e=>{dg=e.target.closest('input[type=range]')?null:{x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),ax:null,to:null,dx:0}},{passive:true});
MN.addEventListener('touchmove',e=>{if(!dg)return;const dx=e.touches[0].clientX-dg.x,dy=e.touches[0].clientY-dg.y;
 if(!dg.ax){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;dg.ax=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y'}
 if(dg.ax!=='x')return;
 const want=nb(dx),w=MN.clientWidth,from=$('#v-'+curV);
 if(want!==dg.to){if(dg.to){const o=$('#v-'+dg.to);o.classList.remove('on');clr(o)}dg.to=want;if(want){const o=$('#v-'+want);o.classList.add('on');o.style.transition='none'}}
 from.style.transition='none';from.style.transform=`translateX(${dg.to?dx:dx*.25}px)`;
 if(dg.to)$('#v-'+dg.to).style.transform=`translateX(${dx+(dx<0?w:-w)}px)`;
 dg.dx=dx},{passive:true});
function endDrag(ok){const d=dg;dg=null;if(!d||d.ax!=='x')return;
 const w=MN.clientWidth,dx=d.dx,sp=Math.abs(dx)/Math.max(1,Date.now()-d.t);
 if(ok&&d.to&&(Math.abs(dx)>w*.25||sp>.5)){if(curV==='pl')openPl=null;show(d.to,dx);return}
 const from=$('#v-'+curV),t='transform .2s ease-out';from.style.transition=t;from.style.transform='translateX(0px)';
 if(d.to){const o=$('#v-'+d.to);o.style.transition=t;o.style.transform=`translateX(${dx<0?w:-w}px)`;setTimeout(()=>{if(curV!==d.to){o.classList.remove('on');clr(o)}},220)}
 setTimeout(()=>clr(from),220)}
MN.addEventListener('touchend',()=>endDrag(true));MN.addEventListener('touchcancel',()=>endDrag(false));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function save(){try{localStorage.setItem('cfg',JSON.stringify({...cfg,shuf,rep,showSongs,recent}))}catch{}}
function paint(){document.documentElement.style.setProperty('--gradc',cfg.grad+'55');bar();for(const k in DEF){document.documentElement.style.setProperty('--'+k,cfg[k]);const i=document.querySelector(`[data-k=${k}]`);if(i)i.value=cfg[k]}}
document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{cfg[i.dataset.k]=i.value;paint();save()});
$('#sw').innerHTML=COLORS.map(c=>`<i data-c="${c}" style="background:${c}"></i>`).join('');
$('#sw').onclick=e=>{const c=e.target.dataset.c;if(c){cfg={...cfg,play:c,active:c,bar:c};paint();save()}};
$('#reset').onclick=()=>{cfg={...DEF};paint();save()};
$('#clear').onclick=async()=>{if(!confirm('Delete every song and playlist from this app? Your original files are not touched.'))return;await tx('readwrite',s=>s.clear());await tx('readwrite',s=>s.clear(),'playlists');au.pause();au.removeAttribute('src');queue=[];qi=-1;openPl=null;show('set');await load();info()};

(async()=>{
 try{const c=JSON.parse(localStorage.getItem('cfg')||'{}');for(const k in DEF)if(c[k])cfg[k]=c[k];shuf=!!c.shuf;rep=c.rep||0;showSongs=c.showSongs!==false;recent=c.recent||[]}catch{}
 paint();ui();au.onpause();
 try{db=await openDB();await load()}catch(e){$('#list').innerHTML='<div class="empty">Storage is blocked in this browser, so songs cannot be saved.</div>'}
})();
</script></body></html>
